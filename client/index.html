<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0907" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Diet Plan" />
    <!-- Increment sw-version to bust stale service worker caches after deploys -->
    <meta name="sw-version" content="6" />
    <!-- Prevent stale cached HTML from being served while debugging -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" href="/icons/icon-152.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Strain v2 primary fonts: Space Grotesk (sans) + IBM Plex Mono (mono) -->
    <!-- Legacy fonts kept for components not yet redesigned -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet" />
    <title>Diet Plan &amp; Tracker</title>

    <!--
      SW force-clear — runs before anything else.
      Unregisters service workers that are pointing to stale / wrong paths so
      they can't serve old cached HTML or JS to the current session.
      Safe to run on every load: getRegistrations() is async and non-blocking.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (reg) {
            var scriptURL = (reg.active || reg.installing || reg.waiting || {}).scriptURL || '';
            // Unregister any SW whose script URL does NOT end with /sw.js
            // (stale registrations from old deployments at different paths)
            if (scriptURL && !scriptURL.endsWith('/sw.js')) {
              reg.unregister();
            }
          });
        });
      }
    </script>

    <!--
      Global error handler — MUST run before any other scripts.
      Always shows the overlay (root-empty check removed so we always see
      stack traces, even if React partially mounted).
      Critical for diagnosing silent iOS Safari failures.
    -->
    <script>
      // Raise stack trace limit before anything else loads
      if (typeof Error !== 'undefined') { Error.stackTraceLimit = 200; }

      window.addEventListener('error', function (e) {
        var stack = (e.error && e.error.stack) ? e.error.stack : 'No stack trace';
        document.body.style.cssText = 'margin:0;padding:0;';
        document.body.innerHTML =
          '<div style="background:#0a0000;color:#ff6b6b;padding:16px;' +
          'font-family:monospace;font-size:11px;position:fixed;inset:0;' +
          'overflow:auto;z-index:99999;line-height:1.5;">' +
          '<h2 style="color:#ff4444;font-size:14px;margin:0 0 8px;">JS Error</h2>' +
          '<p style="margin:4px 0;"><b>Msg:</b> ' + (e.message || 'unknown') + '</p>' +
          '<p style="margin:4px 0;"><b>File:</b> ' + (e.filename || 'unknown') + '</p>' +
          '<p style="margin:4px 0;"><b>Line:</b> ' + e.lineno + ':' + e.colno + '</p>' +
          '<p style="margin:4px 0;font-size:10px;color:#ff9999;word-break:break-all;">' +
          navigator.userAgent + '</p>' +
          '<p style="margin:6px 0 2px;"><b>Stack:</b></p>' +
          '<pre style="background:rgba(255,0,0,0.1);padding:8px;margin:0;' +
          'overflow:auto;white-space:pre-wrap;font-size:9px;word-break:break-all;">' +
          stack.substring(0, 4000) + '</pre>' +
          '<button onclick="location.reload()" style="margin-top:12px;' +
          'padding:8px 18px;background:#C4713A;border:none;color:#fff;' +
          'font-size:12px;cursor:pointer;">Reload</button>' +
          '</div>';
      });

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = (reason && reason.message) ? reason.message : String(reason);
        var stack = (reason && reason.stack) ? reason.stack : 'No stack';
        document.body.style.cssText = 'margin:0;padding:0;';
        document.body.innerHTML =
          '<div style="background:#0a0000;color:#ff6b6b;padding:16px;' +
          'font-family:monospace;font-size:11px;position:fixed;inset:0;' +
          'overflow:auto;z-index:99999;line-height:1.5;">' +
          '<h2 style="color:#ff4444;font-size:14px;margin:0 0 8px;">Unhandled Rejection</h2>' +
          '<p style="margin:4px 0;"><b>Reason:</b> ' + msg + '</p>' +
          '<p style="margin:4px 0;font-size:10px;color:#ff9999;word-break:break-all;">' +
          navigator.userAgent + '</p>' +
          '<p style="margin:6px 0 2px;"><b>Stack:</b></p>' +
          '<pre style="background:rgba(255,0,0,0.1);padding:8px;margin:0;' +
          'overflow:auto;white-space:pre-wrap;font-size:9px;word-break:break-all;">' +
          stack.substring(0, 4000) + '</pre>' +
          '<button onclick="location.reload()" style="margin-top:12px;' +
          'padding:8px 18px;background:#C4713A;border:none;color:#fff;' +
          'font-size:12px;cursor:pointer;">Reload</button>' +
          '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
