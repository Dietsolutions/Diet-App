<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0907" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Diet Plan" />
    <!-- Increment sw-version to bust stale service worker caches after deploys -->
    <meta name="sw-version" content="5" />
    <link rel="apple-touch-icon" href="/icons/icon-152.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Strain v2 primary fonts: Space Grotesk (sans) + IBM Plex Mono (mono) -->
    <!-- Legacy fonts kept for components not yet redesigned -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet" />
    <title>Diet Plan &amp; Tracker</title>

    <!--
      SW force-clear — runs before anything else.
      Unregisters service workers that are pointing to stale / wrong paths so
      they can't serve old cached HTML or JS to the current session.
      Safe to run on every load: getRegistrations() is async and non-blocking.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (reg) {
            var scriptURL = (reg.active || reg.installing || reg.waiting || {}).scriptURL || '';
            // Unregister any SW whose script URL does NOT end with /sw.js
            // (stale registrations from old deployments at different paths)
            if (scriptURL && !scriptURL.endsWith('/sw.js')) {
              reg.unregister();
            }
          });
        });
      }
    </script>

    <!--
      Global error handler — MUST run before any other scripts.
      Only shows the overlay when React hasn't mounted yet (root is empty),
      so a mid-session JS error doesn't wipe a working app off screen.
      Critical for diagnosing silent iOS Safari failures before React mounts.
    -->
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          document.body.innerHTML =
            '<div style="background:#0a0000;color:#ff6b6b;padding:20px;' +
            'font-family:monospace;font-size:13px;position:fixed;inset:0;' +
            'overflow:auto;z-index:99999;line-height:1.6;">' +
            '<h2 style="color:#ff4444;margin:0 0 10px;font-size:16px;">App Error</h2>' +
            '<p><strong>Message:</strong> ' + (e.message || 'unknown') + '</p>' +
            '<p><strong>File:</strong> ' + (e.filename || 'unknown') + '</p>' +
            '<p><strong>Line:</strong> ' + e.lineno + ':' + e.colno + '</p>' +
            '<p style="font-size:11px;color:#ff9999;">' + navigator.userAgent + '</p>' +
            '<button onclick="location.reload()" style="margin-top:16px;' +
            'padding:10px 22px;background:#C4713A;border:none;color:#fff;' +
            'font-size:14px;cursor:pointer;">Reload App</button>' +
            '</div>';
        }
      });

      window.addEventListener('unhandledrejection', function (e) {
        console.error('[unhandledrejection]', e.reason);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
