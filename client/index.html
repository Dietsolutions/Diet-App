<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0907" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Diet Plan" />
    <!-- Increment sw-version to bust stale service worker caches after deploys -->
    <meta name="sw-version" content="4" />
    <link rel="apple-touch-icon" href="/icons/icon-152.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Strain v2 primary fonts: Space Grotesk (sans) + IBM Plex Mono (mono) -->
    <!-- Legacy fonts kept for components not yet redesigned -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet" />
    <title>Diet Plan &amp; Tracker</title>

    <!--
      Global error handler — MUST run before any other scripts.
      Catches JS syntax errors and runtime crashes that happen before React mounts
      and displays them visually on screen (instead of a blank black page).
      Critical for diagnosing silent iOS Safari failures.
    -->
    <script>
      (function () {
        function showError(title, lines) {
          var html = '<div style="background:#0a0000;color:#ff6b6b;padding:20px;font-family:monospace;font-size:13px;position:fixed;inset:0;overflow:auto;z-index:99999;line-height:1.6;">'
            + '<h2 style="color:#ff4444;margin:0 0 12px;font-size:16px;">' + title + '</h2>';
          for (var i = 0; i < lines.length; i++) {
            html += '<p style="margin:4px 0;">' + lines[i] + '</p>';
          }
          html += '<button onclick="location.reload()" style="margin-top:18px;padding:10px 22px;background:#C4713A;border:none;color:#fff;font-size:14px;cursor:pointer;">Reload App</button>';
          html += '</div>';
          document.body.innerHTML = html;
        }

        window.addEventListener('error', function (e) {
          showError('JavaScript Error', [
            '<strong>Message:</strong> ' + (e.message || 'unknown'),
            '<strong>File:</strong> ' + (e.filename || 'unknown'),
            '<strong>Line:</strong> ' + e.lineno + ':' + e.colno,
            '<strong>UA:</strong> ' + navigator.userAgent,
          ]);
        });

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg = reason && reason.message ? reason.message : String(reason);
          var stack = reason && reason.stack ? reason.stack : 'No stack';
          showError('Unhandled Promise Rejection', [
            '<strong>Reason:</strong> ' + msg,
            '<strong>Stack:</strong><br><pre style="margin:4px 0;font-size:11px;white-space:pre-wrap;">' + stack + '</pre>',
            '<strong>UA:</strong> ' + navigator.userAgent,
          ]);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
