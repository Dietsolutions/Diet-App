<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F1EC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planyourplate" />
    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Plan Your Plate — AI-powered meal planning" />
    <meta property="og:description" content="Personalised AI diet plans, meal tracking, shopping lists, and progress analytics — all in one app." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Plan Your Plate" />
    <meta name="twitter:description" content="Personalised AI diet plans, meal tracking, and shopping lists." />
    <meta name="twitter:image" content="/icons/icon-192.png" />
    <!-- Increment sw-version to bust stale service worker caches after deploys -->
    <meta name="sw-version" content="6" />
    <!-- Prevent stale cached HTML from being served while debugging -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" href="/icons/icon-152.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fresh Light fonts: Plus Jakarta Sans (sans) + Archivo (display) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Plan Your Plate</title>

    <!--
      SW force-clear — runs before anything else.
      Unregisters service workers that are pointing to stale / wrong paths so
      they can't serve old cached HTML or JS to the current session.
      Safe to run on every load: getRegistrations() is async and non-blocking.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (reg) {
            var scriptURL = (reg.active || reg.installing || reg.waiting || {}).scriptURL || '';
            // Unregister any SW whose script URL does NOT end with /sw.js
            // (stale registrations from old deployments at different paths)
            if (scriptURL && !scriptURL.endsWith('/sw.js')) {
              reg.unregister();
            }
          });
        });
      }
    </script>

    <!--
      Global error handler — MUST run before any other scripts.
      Always shows the overlay (root-empty check removed so we always see
      stack traces, even if React partially mounted).
      Critical for diagnosing silent iOS Safari failures.
    -->
    <script>
      // Raise stack trace limit before anything else loads
      if (typeof Error !== 'undefined') { Error.stackTraceLimit = 200; }

      window.addEventListener('error', function (e) {
        // IGNORE cross-origin "Script error." — fired by Safari system scripts
        // (Share button, extensions, Reader mode, etc.) injected from a
        // different origin. Browser security strips all detail from these;
        // they are not app errors and cannot be fixed here.
        if (e.message === 'Script error.' || e.message === 'Script error') return;

        // IGNORE anything with no filename and line 0:0 — always an external
        // or system script, never our application code.
        if (!e.filename && e.lineno === 0 && e.colno === 0) return;

        // Only replace the page with an error screen when React hasn't mounted
        // (root is still empty). A background error in an already-running app
        // should not wipe the screen.
        var root = document.getElementById('root');
        if (!root || root.hasChildNodes()) return;

        var stack = (e.error && e.error.stack) ? e.error.stack : 'No stack trace';
        document.body.style.cssText = 'margin:0;padding:0;';
        document.body.innerHTML =
          '<div style="background:#0a0000;color:#ff6b6b;padding:16px;' +
          'font-family:monospace;font-size:11px;position:fixed;inset:0;' +
          'overflow:auto;z-index:99999;line-height:1.5;">' +
          '<h2 style="color:#ff4444;font-size:14px;margin:0 0 8px;">JS Error</h2>' +
          '<p style="margin:4px 0;"><b>Msg:</b> ' + (e.message || 'unknown') + '</p>' +
          '<p style="margin:4px 0;"><b>File:</b> ' + (e.filename || 'unknown') + '</p>' +
          '<p style="margin:4px 0;"><b>Line:</b> ' + e.lineno + ':' + e.colno + '</p>' +
          '<p style="margin:4px 0;font-size:10px;color:#ff9999;word-break:break-all;">' +
          navigator.userAgent + '</p>' +
          '<p style="margin:6px 0 2px;"><b>Stack:</b></p>' +
          '<pre style="background:rgba(255,0,0,0.1);padding:8px;margin:0;' +
          'overflow:auto;white-space:pre-wrap;font-size:9px;word-break:break-all;">' +
          stack.substring(0, 4000) + '</pre>' +
          '<button onclick="location.reload()" style="margin-top:12px;' +
          'padding:8px 18px;background:#C4713A;border:none;color:#fff;' +
          'font-size:12px;cursor:pointer;">Reload</button>' +
          '</div>';
      });

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = (reason && reason.message) ? reason.message : String(reason);
        var stack = (reason && reason.stack) ? reason.stack : 'No stack';
        document.body.style.cssText = 'margin:0;padding:0;';
        document.body.innerHTML =
          '<div style="background:#0a0000;color:#ff6b6b;padding:16px;' +
          'font-family:monospace;font-size:11px;position:fixed;inset:0;' +
          'overflow:auto;z-index:99999;line-height:1.5;">' +
          '<h2 style="color:#ff4444;font-size:14px;margin:0 0 8px;">Unhandled Rejection</h2>' +
          '<p style="margin:4px 0;"><b>Reason:</b> ' + msg + '</p>' +
          '<p style="margin:4px 0;font-size:10px;color:#ff9999;word-break:break-all;">' +
          navigator.userAgent + '</p>' +
          '<p style="margin:6px 0 2px;"><b>Stack:</b></p>' +
          '<pre style="background:rgba(255,0,0,0.1);padding:8px;margin:0;' +
          'overflow:auto;white-space:pre-wrap;font-size:9px;word-break:break-all;">' +
          stack.substring(0, 4000) + '</pre>' +
          '<button onclick="location.reload()" style="margin-top:12px;' +
          'padding:8px 18px;background:#C4713A;border:none;color:#fff;' +
          'font-size:12px;cursor:pointer;">Reload</button>' +
          '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
