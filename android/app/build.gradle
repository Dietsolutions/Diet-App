apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveProp = { String key, String envFallback ->
    // Resolve a value from keystore.properties OR the env.
    // If the properties file contains a shell-style placeholder like ${VAR},
    // it is replaced with the corresponding env value. This is required because
    // the properties file uses ${...} syntax to keep passwords out of the
    // gitignored file when it does exist, and out of the build when it doesn't.
    def v = keystoreProperties.getProperty(key)
    if (v == null || v.startsWith('${') && v.endsWith('}')) {
        def envName = envFallback ?: (v == null ? null : v.substring(2, v.length() - 1))
        return System.getenv(envName) ?: ''
    }
    return v
}

android {
    namespace = "com.dietplan.tracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dietplan.tracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode must be unique per Play Store upload. Auto-increment:
        //   • Local dev:  defaults to 1
        //   • CI:         pass -PversionCode=$GITHUB_RUN_NUMBER or
        //                 set env ANDROID_VERSION_CODE
        def versionCodeOverride = System.getenv('ANDROID_VERSION_CODE') ?: project.findProperty('versionCode') ?: '1'
        versionCode versionCodeOverride.toInteger()
        // versionName is similarly overridable via -PversionName=X.Y.Z or env.
        def versionNameOverride = System.getenv('ANDROID_VERSION_NAME') ?: project.findProperty('versionName') ?: '1.0.0'
        versionName versionNameOverride
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storePath = resolveProp('storeFile', 'ANDROID_KEYSTORE_FILE')
            def storePass = resolveProp('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
            def keyAliasVal = resolveProp('keyAlias', 'ANDROID_KEY_ALIAS')
            def keyPass = resolveProp('keyPassword', 'ANDROID_KEY_PASSWORD')

            if (storePath) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias keyAliasVal
                keyPassword keyPass
            }
            // CI: override via -P flags
            if (project.hasProperty('android.injected.signing.store.file')) {
                storeFile file(project.property('android.injected.signing.store.file'))
                storePassword project.property('android.injected.signing.store.password')
                keyAlias project.property('android.injected.signing.key.alias')
                keyPassword project.property('android.injected.signing.key.password')
            }
        }
    }
    buildTypes {
        release {
            // R8 is required for Play Store submissions to keep the AAB
            // small and the binary obfuscated. Capacitor's default rules
            // + the project's proguard-rules.pro keep the WebView + JS
            // bridge working.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // Keep debug readable; ProGuard would slow iteration.
            minifyEnabled false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
