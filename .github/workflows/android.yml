name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug/release)'
        required: true
        default: 'release'
      upload_play_console:
        description: 'Upload to Play Console'
        required: true
        default: 'false'
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'client/**'
      - 'capacitor.config.ts'
      - 'package.json'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm ci
          npm install --prefix server
          npm install --prefix client --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/diet-plan-release.jks

      - name: Write keystore properties
        working-directory: android
        run: |
          cat > app/keystore.properties <<EOF
          storeFile=diet-plan-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=diet-plan-release
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build AAB
        working-directory: android
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: diet-plan-android-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play Console
        if: inputs.upload_play_console == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dietplan.tracker
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
