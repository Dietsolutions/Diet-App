name: Build iOS

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug/release)'
        required: true
        default: 'release'
      upload_testflight:
        description: 'Upload to TestFlight'
        required: true
        default: 'false'
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'ios/**'
      - 'client/**'
      - 'capacitor.config.ts'
      - 'package.json'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: |
          npm ci
          npm install --prefix server
          npm install --prefix client --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build and archive
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          cd ios
          bundle exec fastlane match appstore --readonly
          xcodebuild archive \
            -workspace App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist App/exportOptions.plist \
            -exportPath build/ \
            -allowProvisioningUpdates

      - uses: actions/upload-artifact@v4
        with:
          name: diet-plan-ios-release-${{ github.run_number }}.ipa
          path: ios/build/App.ipa

      - name: Upload to TestFlight
        if: inputs.upload_testflight == 'true' || startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f ios/build/App.ipa \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_PASSWORD }}" \
            --type ios
