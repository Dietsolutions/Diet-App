name: Build iOS

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug/release)'
        required: true
        default: 'release'
      upload_testflight:
        description: 'Upload to TestFlight'
        required: true
        default: 'false'
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'ios/**'
      - 'client/**'
      - 'capacitor.config.ts'
      - 'package.json'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Install Node dependencies
        run: |
          npm ci
          npm install --prefix server
          npm install --prefix client --legacy-peer-deps

      - name: Build web app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Sync Capacitor (copies dist → ios/App/App/public)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npx cap sync ios

      # This project uses Swift Package Manager — no Podfile, no pod install.
      # SPM packages are declared in ios/App/CapApp-SPM/Package.swift and
      # resolved automatically by xcodebuild before archiving.
      - name: Resolve SPM packages
        working-directory: ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Set up keychain and import certificates
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          cd ios
          bundle exec fastlane match appstore --readonly

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ios
        run: |
          xcodebuild archive \
            -project App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -clonedSourcePackagesDirPath App/SourcePackages \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            | xcpretty || true

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist App/exportOptions.plist \
            -exportPath build/ \
            -allowProvisioningUpdates \
            | xcpretty || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: diet-plan-ios-release-${{ github.run_number }}.ipa
          path: ios/build/App.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: inputs.upload_testflight == 'true' || startsWith(github.ref, 'refs/tags/v')
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          # Write the API key .p8 file
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f ios/build/App.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --type ios \
            --output-format xml
