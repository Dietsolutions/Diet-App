<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI-DPT · Strain v2 · Full redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0C0907; color:#F5EFE8; font-family:'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="s2-theme.jsx"></script>
<script type="text/babel" src="s2-chrome.jsx"></script>
<script type="text/babel" src="s2-screens-core.jsx"></script>
<script type="text/babel" src="s2-screens-meals.jsx"></script>
<script type="text/babel" src="s2-screens-flow.jsx"></script>
<script type="text/babel" src="s2-screens-onboard.jsx"></script>
<script type="text/babel" src="s2-app.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, S2App } = window;
  function App(){
    return (
      <DesignCanvas title="AI-DPT · Strain v2" subtitle="Molten orange on warm near-black · Space Grotesk + IBM Plex Mono">
        <DCSection id="entry" title="Entry · Auth & Onboarding">
          <DCArtboard id="auth" label="Sign in" width={402} height={874}><S2App screen="auth"/></DCArtboard>
          <DCArtboard id="ob1" label="Onboarding · Welcome" width={402} height={874}><S2App screen="ob1"/></DCArtboard>
          <DCArtboard id="ob2" label="Onboarding · Body" width={402} height={874}><S2App screen="ob2"/></DCArtboard>
          <DCArtboard id="ob3" label="Onboarding · Goal" width={402} height={874}><S2App screen="ob3"/></DCArtboard>
          <DCArtboard id="ob4" label="Onboarding · Diet" width={402} height={874}><S2App screen="ob4"/></DCArtboard>
          <DCArtboard id="ob5" label="Onboarding · Generating" width={402} height={874}><S2App screen="ob5"/></DCArtboard>
        </DCSection>

        <DCSection id="core" title="Core tabs" subtitle="Meals · Tracker · Shopping · Tips · Profile">
          <DCArtboard id="meals" label="Meals · Today" width={402} height={874}><S2App screen="meals"/></DCArtboard>
          <DCArtboard id="meal-detail" label="Meal detail" width={402} height={874}><S2App screen="meal"/></DCArtboard>
          <DCArtboard id="water" label="Water sheet" width={402} height={874}><S2App screen="water"/></DCArtboard>
          <DCArtboard id="tracker" label="Tracker" width={402} height={874}><S2App screen="tracker"/></DCArtboard>
          <DCArtboard id="kcal-chart" label="Monthly kcal" width={402} height={874}><S2App screen="kcal"/></DCArtboard>
          <DCArtboard id="shopping" label="Shopping" width={402} height={874}><S2App screen="shopping"/></DCArtboard>
          <DCArtboard id="tips" label="Tips" width={402} height={874}><S2App screen="tips"/></DCArtboard>
          <DCArtboard id="profile" label="Profile · Body" width={402} height={874}><S2App screen="profile"/></DCArtboard>
        </DCSection>

        <DCSection id="flows" title="Flows & modals" subtitle="AI meal replacer · add meal · log weight · plan customiser">
          <DCArtboard id="replace-sheet" label="Swap · sheet" width={402} height={874}><S2App screen="replaceSheet"/></DCArtboard>
          <DCArtboard id="replace-search" label="Swap · search" width={402} height={874}><S2App screen="replaceSearch"/></DCArtboard>
          <DCArtboard id="replace-qty" label="Swap · quantity" width={402} height={874}><S2App screen="replaceQty"/></DCArtboard>
          <DCArtboard id="replace-ai" label="Swap · AI" width={402} height={874}><S2App screen="replaceAI"/></DCArtboard>
          <DCArtboard id="replace-result" label="Swap · result" width={402} height={874}><S2App screen="replaceResult"/></DCArtboard>
          <DCArtboard id="add-meal" label="Add extra meal" width={402} height={874}><S2App screen="addMeal"/></DCArtboard>
          <DCArtboard id="weight-log" label="Log weight" width={402} height={874}><S2App screen="weightLog"/></DCArtboard>
          <DCArtboard id="customise" label="Customise plan" width={402} height={874}><S2App screen="customise"/></DCArtboard>
          <DCArtboard id="meal-prep" label="Meal prep guide" width={402} height={874}><S2App screen="mealPrep"/></DCArtboard>
          <DCArtboard id="regen-confirm" label="Regen · confirm" width={402} height={874}><S2App screen="regenConfirm"/></DCArtboard>
          <DCArtboard id="regen-progress" label="Regen · progress" width={402} height={874}><S2App screen="regenProgress"/></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
